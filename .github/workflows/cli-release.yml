name: Release CLI

# Cross-compiles the toolbox CLI for every supported platform and publishes
# a GitHub Release. install.sh always downloads from the "latest" release,
# so every push to cli/** on main ships automatically - no manual tagging.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Vet and build
        working-directory: cli
        run: |
          go vet ./...

      - name: Determine version
        id: version
        run: |
          version="v$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        working-directory: cli
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/toolbox-${goos}-${goarch}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
              -o "$out" .
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            cli/dist/toolbox-* \
            --title "toolbox ${{ steps.version.outputs.version }}" \
            --notes "Automated build from ${{ github.sha }}"
